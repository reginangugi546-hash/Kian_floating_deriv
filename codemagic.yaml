workflows:
  android-scanner:
    name: Floating Deriv Scanner Android
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.kian.derivscanner"

    scripts:
      - name: Build Android release APK
        script: |
          gradle --version
          gradle :app:assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/output-metadata.json

    publishing:
      email:
        recipients:
          - "$CM_EMAIL"
        notify:
          success: true
          failure: true
