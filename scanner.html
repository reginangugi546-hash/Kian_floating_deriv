<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#05090d;color:#f4f8fb;font-family:Arial;padding:12px}.card{background:#0b1118;border:1px solid #1d2a35;border-radius:18px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;margin:7px 0}.score{font-size:24px;font-weight:bold}button{width:100%;padding:12px;background:#0c9f78;color:#fff;border:0;border-radius:10px;font-weight:bold}.muted{color:#83939f;font-size:12px}</style></head><body><div class="card"><h2>Kian Floating Deriv Scanner</h2><div class="muted">Scanner only • manual use • no automatic trading</div></div><div class="card"><button onclick="scan()">SCAN VOLATILITY MARKETS</button><div id="s" class="muted">Ready.</div></div><div id="o"></div><script>
const M=[['1HZ10V','Volatility 10 (1s)'],['1HZ25V','Volatility 25 (1s)'],['1HZ50V','Volatility 50 (1s)'],['1HZ75V','Volatility 75 (1s)'],['1HZ100V','Volatility 100 (1s)'],['R_10','Volatility 10'],['R_25','Volatility 25'],['R_50','Volatility 50'],['R_75','Volatility 75'],['R_100','Volatility 100']];
function d(q){let x=String(q??'').replace(/[^0-9]/g,'');return x?+x.slice(-1):null}
function a(pr){let x=pr.map(d).filter(v=>v!==null).slice(-250),f=Array(10).fill(0);x.forEach(v=>f[v]++);let p=f.map(v=>v/x.length*100),e=p[0]+p[2]+p[4]+p[6]+p[8],o=100-e,b=e>=o?{l:'EVEN',p:e,b:50}:{l:'ODD',p:o,b:50};for(let z=0;z<10;z++){let ov=x.filter(v=>v>z).length/x.length*100,un=x.filter(v=>v<z).length/x.length*100;if(ov>b.p)b={l:'OVER '+z,p:ov,b:(9-z)*10};if(un>b.p)b={l:'UNDER '+z,p:un,b:z*10};let ma=p[z],df=100-ma;if(ma>b.p)b={l:'MATCH '+z,p:ma,b:10};if(df>b.p)b={l:'DIFFERS '+z,p:df,b:90}}let c=Math.max(0,Math.min(100,50+(b.p-b.b)*2));return{e,o,b,c}}
function scan(){s.textContent='Scanning recent tick history…';o.innerHTML='';let w=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089'),n=M.length;w.onopen=()=>M.forEach((m,i)=>w.send(JSON.stringify({ticks_history:m[0],count:250,end:'latest',style:'ticks',req_id:i+1})));w.onmessage=e=>{let m=JSON.parse(e.data);if(!m.history)return;let r=a(m.history.prices||[]),name=M.find(x=>x[0]==m.echo_req?.ticks_history)?.[1]||'Market';o.innerHTML+=`<div class="card"><b>${name}</b><div class="score">${r.c.toFixed(0)}/100</div><div class="row"><span>Best setup</span><b>${r.b.l}</b></div><div class="row"><span>Observed</span><b>${r.b.p.toFixed(1)}%</b></div><div class="row"><span>Baseline</span><b>${r.b.b.toFixed(1)}%</b></div><div class="row"><span>Even / Odd</span><b>${r.e.toFixed(1)} / ${r.o.toFixed(1)}%</b></div><div class="muted">Statistical estimate only. No trades are placed.</div></div>`;if(--n===0){s.textContent='Scan complete.';w.close()}}}</script></body></html>
